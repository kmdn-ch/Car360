name: Build Android APK

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36 & Build-Tools
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        shell: bash
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK filename and release metadata
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            APK_NAME="Car360.apk"
            TAG="apk-main"
            TITLE="Car360 APK (main)"
            PRERELEASE_FLAG=""
          else
            SAFE_BRANCH="$(printf '%s' "$BRANCH" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')"
            APK_NAME="Car360-${SAFE_BRANCH}.apk"
            TAG="apk-${SAFE_BRANCH,,}"
            TITLE="Car360 APK (${BRANCH})"
            PRERELEASE_FLAG="--prerelease"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          ls -lh "$APK_NAME"
          {
            echo "APK_NAME=$APK_NAME"
            echo "TAG=$TAG"
            echo "TITLE=$TITLE"
            echo "PRERELEASE_FLAG=$PRERELEASE_FLAG"
            echo "BRANCH=$BRANCH"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES="Build automatique Android APK depuis la branche \`${BRANCH}\` (commit \`${SHORT_SHA}\`, ${BUILD_DATE})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
